<div class="auth-container">
    <div class="auth-card">
        <h2>Register</h2>
        <p class="error" *ngIf="error">{{ error }}</p>
        <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="form-group">
                <label>Name</label>
                <input type="text" formControlName="name" placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" formControlName="email" placeholder="Enter email">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" formControlName="phone" placeholder="Enter phone number">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" formControlName="password" placeholder="Min 6 characters">
            </div>
            <button type="submit" [disabled]="form.invalid">Register</button>
        </form>
        <p class="link">Already have an account? <a routerLink="/auth/login">Login</a></p>
    </div>
</div>
