<div class="manage-buses">
  <h2>Manage Buses</h2>
  <p class="message" *ngIf="message">{{ message }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="bus-form">
    <div class="form-row">
      <input formControlName="busName" placeholder="Bus Name" />
      <input formControlName="from" placeholder="From" />
      <input formControlName="to" placeholder="To" />
    </div>
    <div class="form-row">
      <input type="date" formControlName="date" />
      <input type="time" formControlName="departureTime" placeholder="Departure" />
      <input type="time" formControlName="arrivalTime" placeholder="Arrival" />
    </div>
    <div class="form-row">
      <input type="number" formControlName="fare" placeholder="Fare (₹)" />
      <input type="number" formControlName="totalSeats" placeholder="Total Seats" [readonly]="editingId" />
    </div>
    <button type="submit" [disabled]="form.invalid">{{ editingId ? 'Update Bus' : 'Add Bus' }}</button>
  </form>

  <table class="bus-table">
    <thead>
      <tr>
        <th>Bus Name</th><th>From</th><th>To</th><th>Date</th><th>Fare</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let bus of buses">
        <td>{{ bus.busName }}</td>
        <td>{{ bus.from }}</td>
        <td>{{ bus.to }}</td>
        <td>{{ bus.date }}</td>
        <td>₹{{ bus.fare }}</td>
        <td>
          <button (click)="edit(bus)" class="btn-edit">Edit</button>
          <button (click)="delete(bus._id)" class="btn-delete">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
